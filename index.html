<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071820">
  <title>PEPTARIUM | Каталог</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>PEPTARIUM</h1>
    <div class="subtitle">Каталог производителей и продукции</div>
  </header>
  <main>
    <form class="search-box search-form" action="zpch.html" method="get">
      <label class="sr-only" for="product-search">Поиск по каталогу ZPHC</label>
      <input type="search" id="product-search" name="q" placeholder="Поиск по каталогу ZPHC…" autocomplete="off">
      <button type="submit" class="search-submit">Найти</button>
    </form>
    <h2>Производители</h2>
    <a class="brand brand-link" href="zpch.html">
      <div class="brand-heading"><span class="brand-mark">🧬</span><h2>ZPHC</h2><span class="count-chip">7 позиций</span></div>
      <p class="notice">Смотреть товары, варианты дозировок и фотографии упаковок.</p>
      <span class="brand-open">Открыть каталог →</span>
    </a>
    <p class="footnote">PEPTARIUM — справочный каталог. Информация не является медицинской рекомендацией.</p>
  </main>
</body>
</html>
